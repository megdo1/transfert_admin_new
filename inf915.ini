# =====================================================================================
#  INF915 — Configuration de l'orchestrateur de transfert de parc
#
#  L'orchestrateur ne prend aucun paramètre de lancement : tout se règle ici. Le
#  fichier est cherché dans le répertoire du script, sous le nom inf915.ini.
#
#  Il contient des identifiants de connexion et doit être lisible du seul compte qui
#  exécute l'orchestrateur :
#      chmod 600 inf915.ini && chown <compte_batch> inf915.ini
# =====================================================================================

[base]
# Compte propriétaire des tables INF915_*. Il doit avoir le droit d'exécuter
# INF915_PY et d'écrire dans les tables Clarify touchées par le transfert.
utilisateur = INF915

# Mot de passe. Laisser vide pour utiliser un Oracle Wallet, auquel cas l'entrée du
# wallet doit porter le même alias que le dsn ci-dessous, et utilisateur doit valoir /
mot_de_passe = a_renseigner

# Descripteur de connexion, sous l'une de ces trois formes :
#   hote:port/service      srv-ora-rcone.sfr.fr:1521/RCONEP
#   alias TNS              RCONEP
#   descripteur complet    (DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=...)...))
dsn = srv-ora-rcone:1521/RCONEP

# Encodage client. Laisser UTF-8 sauf contrainte du socle.
encodage = UTF-8


[orchestrateur]
# Nombre de processus lancés sur une demande pendant le transfert des lignes.
#
# Les lignes leur sont distribuées une par une : dès qu'un processus a fini la sienne,
# il prend la suivante. La charge s'équilibre donc d'elle-même, et il n'y a aucune
# taille de lot à régler. C'est le seul levier de performance de l'orchestrateur.
#
# Le nombre de cœurs de la machine n'est pas la limite : les processus passent presque
# tout leur temps à attendre la base, et ne consomment du CPU que pour émettre l'appel.
# On peut donc dépasser largement le nombre de cœurs. Les vraies limites sont ailleurs :
#
#   - chaque processus ouvre une connexion Oracle, qui reste ouverte le temps de la
#     demande. Vérifier que SESSIONS et PROCESSES de l'instance les absorbent, en
#     comptant aussi les autres applications ;
#   - ces connexions sont ouvertes et refermées à chaque demande traitée. Sur un lot
#     de nombreuses petites demandes, l'établissement des connexions finit par peser
#     plus que le travail lui-même ;
#   - le compteur NB_LIGNES_OK de la notification, que chaque ligne transférée
#     incrémente, verrouille cette ligne le temps de deux instructions seulement : il
#     est mis à jour juste avant le COMMIT, et non au début de la transaction. Le
#     verrou n'est donc pas tenu pendant le transfert. Il ne deviendrait limitant que
#     si une ligne descendait sous la milliseconde, ce qui n'arrive pas ici. Ne pas
#     remonter cet UPDATE dans PR_TRAITER_LIGNE : ce serait le seul moyen de rendre
#     les vingt processus équivalents à un seul.
#
# N'a aucun effet sur la création des objets parents, qui se fait toujours une demande
# après l'autre dans le processus courant.
# 1 exécute tout sans pool : utile en analyse.
nb_process = 20

# Ancienneté, en minutes, au-delà de laquelle une ligne restée EN_COURS est considérée
# comme abandonnée par un worker mort, et remise en file avant le traitement.
# 0 désactive la reprise automatique.
minutes_avant_liberation = 30

# 0  : une exécution des deux passes, puis sortie. La répétition revient à
#      l'ordonnanceur, ce qui est le mode conseillé.
# > 0 : le programme reste en vie et recommence après ce nombre de secondes.
intervalle_boucle = 0


[journal]
# DEBUG, INFO, WARNING, ERROR
niveau = INFO

# Chemin du fichier de journal. Laisser vide pour n'écrire que sur la sortie standard.
# Les processus fils écrivent dans un fichier suffixé .worker
fichier = /var/log/inf915/orchestrateur.log

# Nombre de fichiers d'archive conservés par rotation quotidienne.
retention_jours = 30
